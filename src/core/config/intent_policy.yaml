# Unified Intent Execution Policy
#
# SOURCE OF TRUTH: This file defines BOTH planning completeness and execution sequencing
# for intents. It serves as the future authoritative policy for intent behavior.
#
# STATUS: Active runtime policy. Loaded by core/policy/intent_policy.py via
# _load_unified_policy(). All planning and execution behavior is driven from this file.
#
# Structure:
# - metadata: Intent metadata (durable: true/false)
# - planning: Defines slot requirements for planning completeness
#   - required_slots: Slots that must be filled for full execution
#   - optional_slots: Slots that can be provided but are not mandatory
#   - executable_with: Subsets of slots that allow partial execution
# - execution: Defines execution actions with their requirements and sequencing
#   - Each step has: mode (exploratory | committing), required_slots, optional_slots,
#     resolves, requires, client
#   - requires: business facts (derived at runtime) that must be true to select the step

intents:
  CREATE_APPOINTMENT:
    metadata:
      durable: true
    planning:
      required_slots:
        - service_id
        - date
        - time
      optional_slots:
        - date
        - time
      executable_with:
        # Can search availability with just service_id
        - service_id
    execution:
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - service_id
        optional_slots:
          - date
          - time
        requires:
          - availability_check_required
        resolves:
          - availability
        client: availability_client

      CONFIRM_APPOINTMENT:
        mode: committing
        required_slots:
          - service_id
          - date
          - time
        requires:
          - availability_ready
          - time_selection_ready
          - user_confirmation_satisfied
        client: booking_client

  CREATE_RESERVATION:
    metadata:
      durable: true
    planning:
      required_slots:
        - service_id
        - date_range
      optional_slots:
        - date_range
      executable_with:
        # Can search availability with just service_id
        - service_id
    execution:
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - service_id
        optional_slots:
          - date_range
        requires:
          - availability_check_required
        resolves:
          - availability
        client: availability_client

      CREATE_BOOKING_HOLD:
        mode: committing
        required_slots:
          - service_id
          - date_range
        requires:
          - booking_hold_required
        client: booking_client
      FINALIZE_RESERVATION:
        mode: exploratory
        required_slots:
          - booking_id
          - booking_code
        requires:
          - booking_hold_ready
        client: booking_client

  MODIFY_BOOKING:
    metadata:
      durable: true
    planning:
      required_slots:
        - booking_id
        - date
      optional_slots:
        - time
        - date_range
      executable_with:
        # Can start execution (FETCH_BOOKING / SEARCH_AVAILABILITY) with just booking_id
        - booking_id
    execution:
      FETCH_BOOKING:
        mode: exploratory
        required_slots: []
        requires:
          - booking_identification_required
        resolves:
          - booking_id
        client: booking_client
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - booking_id
        optional_slots:
          - date
          - time
          - date_range
        requires:
          - booking_identified
          - availability_check_required
        resolves:
          - availability
        client: availability_client

      APPLY_MODIFICATION:
        mode: committing
        required_slots:
          - booking_id
        optional_slots:
          - date
          - time
          - date_range
        requires:
          - availability_ready
          - user_confirmation_satisfied
        client: booking_client

  MODIFY_RESERVATION:
    metadata:
      durable: true
    planning:
      required_slots:
        - booking_id
      optional_slots:
        - start_date
        - end_date
        - date_range
      executable_with:
        # Can preview modifications with just booking_id
        - booking_id
    execution:
      FETCH_BOOKING:
        mode: exploratory
        required_slots: []
        requires:
          - booking_identification_required
        resolves:
          - booking_id
        client: booking_client
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - booking_id
        optional_slots:
          - start_date
          - end_date
          - date_range
        requires:
          - booking_identified
          - availability_check_required
        resolves:
          - availability
        client: availability_client
      APPLY_MODIFICATION:
        mode: committing
        required_slots:
          - booking_id
        optional_slots:
          - start_date
          - end_date
          - date_range
        requires:
          - availability_ready
          - user_confirmation_satisfied
        client: booking_client

  CANCEL_BOOKING:
    metadata:
      durable: true
    planning:
      required_slots:
        - booking_id
      optional_slots: []
      executable_with:
        # Can identify/fetch booking with just booking_id
        - booking_id
    execution:
      FETCH_BOOKING:
        mode: exploratory
        required_slots: []
        requires:
          - booking_identification_required
        resolves:
          - booking_id
        client: booking_client
      CONFIRM_CANCELLATION:
        mode: committing
        required_slots:
          - booking_id
        optional_slots: []
        requires:
          - booking_identified
        client: booking_client

  CHECK_AVAILABILITY:
    metadata:
      durable: false
    # Cold-start redirected to CREATE_APPOINTMENT in Stage 01 (same as AVAILABILITY).
    planning:
      required_slots:
        - service_id
      optional_slots:
        - date
        - time
        - date_range
      executable_with:
        - service_id
    execution:
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - service_id
        optional_slots:
          - date
          - time
          - date_range
        requires:
          - availability_check_required
        resolves:
          - availability
        client: availability_client

  # NLU emits AVAILABILITY (not CHECK_AVAILABILITY). Same exploratory search
  # contract; durable:false. Stage 01 redirects cold-start onto CREATE_APPOINTMENT
  # so planning never owns an ephemeral intent_name.
  AVAILABILITY:
    metadata:
      durable: false
    planning:
      required_slots:
        - service_id
      optional_slots:
        - date
        - time
        - date_range
      executable_with:
        - service_id
    execution:
      SEARCH_AVAILABILITY:
        mode: exploratory
        required_slots:
          - service_id
        optional_slots:
          - date
          - time
          - date_range
        requires:
          - availability_check_required
        resolves:
          - availability
        client: availability_client

  VIEW_BOOKING:
    metadata:
      durable: false
    planning:
      required_slots:
        - booking_id
      optional_slots: []
      executable_with:
        - booking_id
    execution:
      FETCH_BOOKING:
        mode: exploratory
        required_slots: []
        requires:
          - booking_identification_required
        resolves:
          - booking_id
        client: booking_client
