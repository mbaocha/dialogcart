# Intent Execution Configuration
#
# EXECUTION-ONLY: This file defines ONLY action → handler routing.
# It does NOT define slot requirements, missing slots, or planning logic.
#
# Planning logic (required_slots, missing_slots, executable_actions) is defined
# in intent_planning.yaml and computed by the planner.
#
# This file is a simple mapping: action name → handler function name.
# All slot-based conditions and fallbacks have been removed.

intents:

  CREATE_APPOINTMENT:
    # Action → handler mapping only
    # Planning (slots, missing_slots, executable_actions) is in intent_planning.yaml
    commit:
      action: CONFIRM_APPOINTMENT

  CREATE_RESERVATION:
    # Action → handler mapping only
    commit:
      action: CONFIRM_RESERVATION

  MODIFY_BOOKING:
    # Action → handler mapping only
    commit:
      action: APPLY_MODIFICATION

  CANCEL_BOOKING:
    # Action → handler mapping only
    commit:
      action: CONFIRM_CANCELLATION
