# Intent Planning Policy Configuration
# 
# AUTHORITATIVE SOURCE: This is the ONLY file that defines planning logic.
# - required_slots: Slots that must be filled for full execution
# - optional_slots: Slots that can be provided but are not mandatory
# - executable_with: Subsets of slots that allow partial execution (e.g., search with just service_id)
#
# All missing_slots and executable_actions MUST be computed from this file only.
# No other file should define or compute slot requirements.

intents:
  CREATE_APPOINTMENT:
    description: >
      Create a time-bound service appointment.
      Service identity is guaranteed by Luma aliases.
    required_slots:
      - service_id
      - date
      - time
    optional_slots:
      - date
      - time
    executable_with:
      # Can search availability with just service_id
      - service_id

  CREATE_RESERVATION:
    description: >
      Create a date-range reservation (e.g. rooms, assets).
    required_slots:
      - service_id
      - date_range
    optional_slots:
      - date_range
    executable_with:
      # Can search availability with just service_id
      - service_id

  MODIFY_BOOKING:
    description: >
      Modify an existing appointment or reservation.
      Booking identity is mandatory; changes are optional.
    required_slots:
      - booking_id
    optional_slots:
      - date
      - time
      - date_range
    executable_with:
      # Can preview modifications with just booking_id
      - booking_id

  MODIFY_RESERVATION:
    description: >
      Modify an existing reservation (date-range changes).
      Booking identity is mandatory; date changes are optional.
    required_slots:
      - booking_id
    optional_slots:
      - start_date
      - end_date
      - date_range
    executable_with:
      # Can preview modifications with just booking_id
      - booking_id

  CANCEL_BOOKING:
    description: >
      Cancel an existing booking.
    required_slots:
      - booking_id
    optional_slots: []
    executable_with:
      # Can identify/fetch booking with just booking_id
      - booking_id

