# Dialog Policy Configuration
# Maps (intent, missing_slots) to advisory dialog prompts
# Prompts are advisory and do not enforce order - users can provide missing slots in any order

dialog_prompts:
  CREATE_APPOINTMENT:
    prompts:
      # Single missing slot prompts
      - missing_slots: ["date"]
        prompt: "What date would you like?"
      - missing_slots: ["time"]
        prompt: "What time would you like?"
      - missing_slots: ["service_id"]
        prompt: "What service would you like to book?"
      
      # Multiple missing slots prompts (advisory, no order enforced)
      - missing_slots: ["date", "time"]
        prompt: "What date and time would you like?"
      - missing_slots: ["service_id", "date"]
        prompt: "What service and date would you like?"
      - missing_slots: ["service_id", "time"]
        prompt: "What service and time would you like?"
      - missing_slots: ["service_id", "date", "time"]
        prompt: "What service, date, and time would you like?"
    default: "What information would you like to provide?"

  CREATE_RESERVATION:
    prompts:
      # Single missing slot prompts
      - missing_slots: ["service_id"]
        prompt: "What would you like to reserve?"
      - missing_slots: ["date_range"]
        prompt: "What dates would you like?"
      - missing_slots: ["start_date"]
        prompt: "What start date would you like?"
      - missing_slots: ["end_date"]
        prompt: "What end date would you like?"
      
      # Multiple missing slots prompts
      - missing_slots: ["service_id", "date_range"]
        prompt: "What would you like to reserve and for what dates?"
      - missing_slots: ["service_id", "start_date"]
        prompt: "What would you like to reserve and what start date?"
      - missing_slots: ["service_id", "end_date"]
        prompt: "What would you like to reserve and what end date?"
      - missing_slots: ["start_date", "end_date"]
        prompt: "What start and end dates would you like?"
      - missing_slots: ["service_id", "start_date", "end_date"]
        prompt: "What would you like to reserve and for what dates?"
    default: "What information would you like to provide?"

  MODIFY_BOOKING:
    prompts:
      # Single missing slot prompts
      - missing_slots: ["booking_id"]
        prompt: "Which booking would you like to modify?"
      - missing_slots: ["date"]
        prompt: "What date would you like to change it to?"
      - missing_slots: ["time"]
        prompt: "What time would you like to change it to?"
      - missing_slots: ["date_range"]
        prompt: "What dates would you like to change it to?"
      
      # Multiple missing slots prompts
      - missing_slots: ["booking_id", "date"]
        prompt: "Which booking would you like to modify and what date?"
      - missing_slots: ["booking_id", "time"]
        prompt: "Which booking would you like to modify and what time?"
      - missing_slots: ["booking_id", "date", "time"]
        prompt: "Which booking would you like to modify and what date and time?"
      - missing_slots: ["date", "time"]
        prompt: "What date and time would you like to change it to?"
    default: "What would you like to modify?"

  CANCEL_BOOKING:
    prompts:
      # Single missing slot prompts
      - missing_slots: ["booking_id"]
        prompt: "Which booking would you like to cancel?"
    default: "Which booking would you like to cancel?"

# Default fallback for unknown intents
default_intent_prompt: "What information would you like to provide?"
