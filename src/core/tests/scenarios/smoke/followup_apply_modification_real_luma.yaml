scenarios:
  - name: apply_modification_happy_path
    description: User modifies booking with booking_id and new date/time provided
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "reschedule my booking"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["booking_id"]
          no_premature_execution: true

      - sentence: "booking ABC12345 to tomorrow at 2pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_all_slots_one_turn
    description: User provides booking_id and modification in same turn (two-step flow required)
    domain: service
    aliases:
      massage: massage
    turns:
      - sentence: "change booking XYZ67890 to next monday at 3pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          missing_slots: []

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_exploratory_first
    description: User requests modification without booking_id, then provides it
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "i need to reschedule"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["booking_id"]
          no_premature_execution: true

      - sentence: "booking DEF99999"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["date", "time"]
          intent_preserved: true
          no_premature_execution: true

      - sentence: "to tomorrow at 4pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_booking_id_then_date_time
    description: User provides booking_id first, then new date/time
    domain: service
    aliases:
      facial: facial
    turns:
      - sentence: "change booking GHI11111"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["date", "time"]
          no_premature_execution: true

      - sentence: "to next friday at 5pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_no_premature_execution
    description: Ensure modification only executes when all required slots are present
    domain: service
    aliases:
      massage: massage
    turns:
      - sentence: "reschedule booking JKL22222"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["date", "time"]
          no_premature_execution: true

      - sentence: "to tomorrow"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["time"]
          intent_preserved: true
          no_premature_execution: true

      - sentence: "at 6pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_date_time_then_booking_id
    description: User provides date/time before booking_id (out-of-order slots)
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "move it to friday at 4pm"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["booking_id"]
          no_premature_execution: true

      - sentence: "booking ABC123"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true
          # Verify slots merged: date and time should be preserved from turn 1
          # Note: Actual slot values depend on Luma extraction, but intent should be preserved

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_fuzzy_time_requires_clarification
    description: Fuzzy/ambiguous time like "afternoon" requires clarification
    domain: service
    aliases:
      massage: massage
    turns:
      - sentence: "reschedule booking ABC123 to tomorrow afternoon"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["time"]
          no_premature_execution: true
          # Date should be filled, but time not resolved from "afternoon"

      - sentence: "at 3pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true

  - name: apply_modification_switch_to_cancel_mid_flow
    description: User switches from MODIFY_BOOKING to CANCEL_BOOKING mid-flow (durable intent reset)
    domain: service
    aliases:
      facial: facial
    turns:
      - sentence: "change booking ABC123"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["date", "time"]
          no_premature_execution: true

      - sentence: "actually cancel it"
        expect:
          status: NEEDS_CLARIFICATION
          action: FETCH_BOOKING
          missing_slots: ["booking_id"]
          intent_switched: true
          # Intent switches from MODIFY_BOOKING to CANCEL_BOOKING
          # Session resets, booking_id from previous session is lost
          # System requires booking_id to be re-provided for CANCEL_BOOKING

  - name: apply_modification_repeated_confirmation_denial
    description: User denies confirmation multiple times (no accidental commit)
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "change booking ABC123 to friday at 3pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          missing_slots: []

      - sentence: "no"
        expect:
          status: NON_DURABLE_INTENT
          # REJECT_ACTION is non-durable and interrupts the flow
          # Session is not preserved, flow is broken
          # This reflects current system behavior where "no" breaks durable intents

  - name: apply_modification_time_correction
    description: User corrects time value, overwriting previous value
    domain: service
    aliases:
      massage: massage
    turns:
      - sentence: "change booking ABC123 to friday at 3pm"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          missing_slots: []

      - sentence: "make that 4pm instead"
        expect:
          status: READY
          action: SEARCH_AVAILABILITY
          intent_preserved: true
          no_premature_execution: true
          # Time should be overwritten to 4pm, date preserved
          # New SEARCH_AVAILABILITY triggered, no APPLY_MODIFICATION yet

      - sentence: "yes"
        expect:
          status: READY
          action: APPLY_MODIFICATION
          intent_preserved: true
