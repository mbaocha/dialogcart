scenarios:
  - name: book_service_with_missing_time
    description: Exploratory READY when service+date present (time missing); no availability_client
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "book a haircut tomorrow"
        expect:
          status: READY
          missing_slots: ["time"]
          text:
            present: false

      - sentence: "2pm"
        expect:
          status: AWAITING_CONFIRMATION
          missing_slots: []
          text:
            present: true
            intent: confirmation

  - name: generic_clarification_fallback
    description: Exploratory READY with service+date proposal (time missing); no clarification text
    domain: service
    aliases:
      haircut: haircut
    turns:
      - sentence: "book something"
        expect:
          status: READY
          missing_slots: ["time"]
          text:
            present: false
